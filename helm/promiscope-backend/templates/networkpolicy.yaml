{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "promiscope-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "promiscope-backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "promiscope-backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
        {{- with .Values.networkPolicy.additionalIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}
