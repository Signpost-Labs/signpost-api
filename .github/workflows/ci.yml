name: Backend CI
on:
  push:
    branches:
    - main
    - dev
  pull_request:
    branches:
    - main
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
        - 22
        - 24
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - name: Lint
      run: npm run lint
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version:
        - 22
        - 24
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - name: Install sqlite3 CLI
      run: "sudo sed -i 's|//azure\\.archive\\.ubuntu\\.com|//archive.ubuntu.com|g'\
        \ \\\n  /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt\
        \ 2>/dev/null || true\ntimeout 180 sudo apt-get update -o Acquire::Retries=3\
        \ -o Acquire::http::Timeout=15\nsudo apt-get install -y --no-install-recommends\
        \ sqlite3\n"
    - name: Validate env example
      run: node scripts/validate-env.js --strict-extras
    - name: Check every route has canonical-source documentation
      run: npm run docs:check
    - name: Validate OpenAPI spec is in sync with route sources
      run: npm run validate:openapi
    - name: Validate generated TypeScript client
      run: npm run validate:client
    - name: Type check generated TypeScript client
      run: npm run typecheck:client
    - name: Check for unsafe SQL string interpolation
      run: npm run check:sql-injection
    - name: Validate Helm chart topology defaults
      run: bash scripts/validate-helm-chart.sh
    - name: Validate Helm env-var wiring (issue
      run: bash scripts/validate-helm-env-wiring.sh
    - name: Type check (src)
      run: node node_modules/.bin/tsc --noEmit
    - name: Type check (scripts)
      run: node node_modules/.bin/tsc --noEmit -p tsconfig.scripts.json
    - name: Run tests with coverage
      run: npm run test:coverage -- --forceExit --coverageReporters=text --coverageReporters=lcov
      env:
        CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
    - name: Upload coverage to Codecov
      if: matrix.node-version == 22 && env.CODECOV_TOKEN != ''
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage/lcov.info
        fail_ci_if_error: false
    - name: Upload coverage report as artifact
      if: matrix.node-version == 22
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: coverage/
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - name: Validate env example
      run: node scripts/validate-env.js
    - name: Upload coverage to Codecov
      if: matrix.node-version == 22
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage/lcov.info
        fail_ci_if_error: false
    - name: Upload coverage report as artifact
      if: matrix.node-version == 22
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promiscope_ci
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
    - name: Type check (src)
      run: node node_modules/.bin/tsc --noEmit
    - name: Run test suite against DB_DRIVER=postgres
      run: npm run test:postgres
      env:
        DB_DRIVER: postgres
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/promiscope_ci
        POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/promiscope_ci
        CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
  redis-integration:
    name: Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
    - name: Run integration tests against Redis
      run: node node_modules/jest/bin/jest.js --runInBand --forceExit --runTestsByPath
        tests/services/redis.integration.test.ts
      env:
        REDIS_URL: redis://127.0.0.1:6379
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
    - name: Build
      run: npm run build
    - name: Boot dist/index.js and wait for /health
      env:
        NODE_ENV: test
        PORT: 4000
        DB_PATH: /tmp/smoke-test.db
        JWT_SECRET: test-secret-min-32-chars-for-ci-only
        CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
      run: "node dist/index.js &\nSERVER_PID=$!\n\nfor i in $(seq 1 30); do\n  if\
        \ curl -sf http://localhost:4000/health > /dev/null; then\n    echo \"Server\
        \ is up after ${i}s\"\n    break\n  fi\n  if ! kill -0 $SERVER_PID 2>/dev/null;\
        \ then\n    echo \"Server process exited before becoming healthy\"\n    exit\
        \ 1\n  fi\n  sleep 1\ndone\n\nstatus=$(curl -s -o /dev/null -w '%{http_code}'\
        \ http://localhost:4000/health)\nif [ \"$status\" != \"200\" ]; then\n  echo\
        \ \"Expected 200 from /health, got $status\"\n  kill \"$SERVER_PID\" 2>/dev/null\
        \ || true\n  exit 1\nfi\n\nkill -TERM \"$SERVER_PID\"\nwait \"$SERVER_PID\"\
        \ || true\n"
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
    - name: Audit production dependencies (high/critical)
      run: npm audit --omit=dev --audit-level=high
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image with OCI build args
      run: "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')\nVERSION=$(node -p \"require('./package.json').version\"\
        )\ndocker build \\\n  --build-arg GIT_COMMIT=${{ github.sha }} \\\n  --build-arg\
        \ VERSION=\"${VERSION}\" \\\n  --build-arg BUILD_DATE=\"${BUILD_DATE}\" \\\
        \n  --tag promiscope-backend:ci \\\n  .\n"
    - name: Scan Docker image for vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: promiscope-backend:ci
        format: table
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
        severity: HIGH,CRITICAL
    - name: Verify GIT_COMMIT is set in the image
      run: "commit=$(docker run --rm \\\n  -e CONTRACT_ID=CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4\
        \ \\\n  -e JWT_SECRET=test-secret-min-32-chars-for-ci-only \\\n  promiscope-backend:ci\
        \ \\\n  node -e \"console.log(process.env.GIT_COMMIT)\")\necho \"GIT_COMMIT\
        \ in image: $commit\"\ntest \"$commit\" = \"${{ github.sha }}\"\n"
    - name: Docker smoke test - verify app boots and health endpoints work
      run: "# Run the container with test env vars, binding port 4000\ndocker run\
        \ --rm -d \\\n  --name promiscope-ci \\\n  -p 4000:4000 \\\n  -e NODE_ENV=test\
        \ \\\n  -e PORT=4000 \\\n  -e DB_PATH=/data/promiscope.db \\\n  -e CONTRACT_ID=CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4\
        \ \\\n  -e JWT_SECRET=test-secret-min-32-chars-for-ci-only \\\n  promiscope-backend:ci\n\
        \n# Wait for the app to become healthy\nattempt=0\nmax_attempts=30\nwhile\
        \ [ $attempt -lt $max_attempts ]; do\n  status=$(curl -s -o /dev/null -w '%{http_code}'\
        \ http://localhost:4000/health/liveness 2>/dev/null || echo \"000\")\n  if\
        \ [ \"$status\" = \"200\" ]; then\n    echo \"鉁?/health/liveness returned\
        \ 200 after ${attempt}s\"\n    break\n  fi\n  if [ $attempt -eq $((max_attempts\
        \ - 1)) ]; then\n    echo \"鉁?Server failed to become healthy within ${max_attempts}s\"\
        \n    docker logs promiscope-ci\n    docker stop promiscope-ci || true\n \
        \   exit 1\n  fi\n  sleep 1\n  attempt=$((attempt + 1))\ndone\n\n# Test health\
        \ endpoints\nfor endpoint in \"/health/liveness\" \"/health/readiness\"; do\n\
        \  status=$(curl -s -o /dev/null -w '%{http_code}' \"http://localhost:4000${endpoint}\"\
        )\n  if [ \"$status\" != \"200\" ]; then\n    echo \"鉁?${endpoint} returned\
        \ ${status}, expected 200\"\n    docker logs promiscope-ci\n    docker stop\
        \ promiscope-ci || true\n    exit 1\n  fi\n  echo \"鉁?${endpoint} returned\
        \ 200\"\ndone\n\n# Test a DB-backed endpoint by creating a test player and\
        \ checking it\n# The /api/players endpoint should work if DB is initialized\n\
        status=$(curl -s -o /dev/null -w '%{http_code}' -X GET \"http://localhost:4000/api/players\"\
        \ \\\n  -H \"Authorization: Bearer test-token\" 2>/dev/null || echo \"000\"\
        )\nif [ \"$status\" = \"401\" ] || [ \"$status\" = \"200\" ]; then\n  # 401\
        \ = auth failed but endpoint exists and tried to check auth (good)\n  # 200\
        \ = endpoint fully worked (also good)\n  echo \"鉁?DB-backed endpoint /api/players\
        \ responded with HTTP $status (DB accessible)\"\nelse\n  echo \"鉁?/api/players\
        \ returned ${status}, expected 401 or 200\"\n  docker logs promiscope-ci\n\
        \  docker stop promiscope-ci || true\n  exit 1\nfi\n\n# Get image size for\
        \ regression detection\nimage_size=$(docker images --no-trunc --quiet promiscope-backend:ci\
        \ | xargs docker inspect -f '{{.Size}}')\nimage_size_mb=$((image_size / 1024\
        \ / 1024))\necho \"Docker image size: ${image_size_mb}MB\"\n\ndocker stop\
        \ promiscope-ci\n\n# Fail if image grew by >10% from a baseline (this is a\
        \ soft check; adjust as needed)\n# For now just report it; future PRs can\
        \ establish a baseline\necho \"::notice::Docker image: ${image_size_mb}MB\
        \ (check regression vs prior builds)\"\n"
  contracts:
    name: Soroban Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.81.0
        targets: wasm32-unknown-unknown
        components: clippy, rustfmt
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          contracts/target

          '
        key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-
    - name: Build contracts (WASM)
      working-directory: contracts
      run: cargo build --target wasm32-unknown-unknown --release
    - name: Check formatting
      working-directory: contracts
      run: cargo fmt --all -- --check
    - name: Run Clippy
      working-directory: contracts
      run: cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu
        -- -D warnings
    - name: Report optimized WASM sizes
      run: bash scripts/report-contract-wasm-size.sh
    - name: Run unit tests
      working-directory: contracts
      run: cargo test --workspace --lib --target x86_64-unknown-linux-gnu
    - name: Run invariant fuzz tests
      working-directory: contracts
      env:
        PROPTEST_CASES: ${{ vars.PROPTEST_CASES || '256' }}
      run: cargo test --workspace --tests --target x86_64-unknown-linux-gnu -- invariants
